<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Architecture — Interactive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1A1A; --ink-soft:#4a4a4a; --paper:#FFFFFF;
    --accent:#D9381E; --accent-soft:#F28B7A; --ok:#3f7a52; --muted:#8a8a8a;
    --zone-h:#F2F1EC; --zone-c:#E3EFE3; --zone-x:#FBE4E1; --zone-s:#FBF0DC; --zone-k:#E1EAF5; --zone-e:#EAE6F0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%; background:var(--paper); color:var(--ink); font-family:'Archivo','Helvetica Neue',Arial,sans-serif;}
  body{display:flex; flex-direction:column; overflow:hidden;}

  header{padding:12px 24px 10px 24px; border-bottom:1px solid #E0E0E0; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; flex-shrink:0;}
  .htitle{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .kicker{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; display:flex; align-items:center; gap:8px;}
  .kicker .dot{width:6px;height:6px;background:var(--accent);display:inline-block;}
  h1{font-weight:900; font-size:19px; letter-spacing:-.01em;}
  .toolbar{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .tbtn{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.03em; padding:6px 10px; border:2px solid var(--ink); background:var(--paper); color:var(--ink); cursor:pointer; transition:transform .08s ease, background .12s ease, color .12s ease;}
  .tbtn:hover{transform:translateY(-1px);}
  .tbtn:focus-visible{outline:3px solid var(--accent-soft); outline-offset:2px;}
  .tbtn.active{background:var(--ink); color:#fff;}
  .tbtn.accent{border-color:var(--accent); color:var(--accent);}
  .tbtn.accent.active{background:var(--accent); color:#fff;}
  .tbtn.play{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tbtn.play.active{background:var(--ink); border-color:var(--ink);}
  .sep{width:1px; height:24px; background:#D0D0D0; margin:0 4px;}
  .zoomgroup{display:flex; align-items:center; border:2px solid var(--ink);}
  .zbtn{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; width:28px; height:28px; border:none; background:#fff; color:var(--ink); cursor:pointer;}
  .zbtn:hover,.zfit:hover{background:var(--ink); color:#fff;}
  .zlabel{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); width:46px; height:28px; display:flex; align-items:center; justify-content:center; border-left:1px solid var(--ink); border-right:1px solid var(--ink);}
  .zfit{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; height:28px; padding:0 9px; border:none; background:#fff; cursor:pointer;}

  main{flex:1; min-height:0; padding:10px 20px 0 20px; display:flex; flex-direction:column;}
  .canvas-scroll{overflow:auto; border:2px solid var(--ink); background:#fff; flex:1; min-height:0; position:relative;}
  .stage-sizer{position:relative; margin:0 auto;}
  .stage{position:absolute; top:0; left:0; width:1800px; height:1080px; transform-origin:top left;}
  .stage svg{position:absolute; inset:0; width:1800px; height:1080px; display:block;}

  /* node overlays */
  .node{position:absolute; display:flex; flex-direction:column; justify-content:center; gap:4px; padding:10px 14px; cursor:pointer; user-select:none;}
  .node:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .node .n-eyebrow{font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);}
  .node .n-title{font-weight:800; font-size:15px; line-height:1.22; color:var(--ink); text-decoration:underline; text-decoration-color:transparent;}
  .node:hover .n-title{text-decoration-color:var(--ink);}
  .node .n-sub{font-family:'JetBrains Mono',monospace; font-size:10.8px; color:var(--ink-soft); line-height:1.42;}
  .node .n-badge{position:absolute; top:-9px; right:-9px; width:20px; height:20px; border-radius:50%; background:var(--ink); color:#fff; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid #fff;}
  .node.gate{padding:10px 12px; justify-content:flex-start;}
  .node.gate .n-title{font-size:13.5px;}
  .node.gate .n-sub{font-size:10.3px;}
  .node.big{justify-content:flex-start; padding-top:12px;}
  .node.big .n-title{font-size:17px;}
  .node.tag{cursor:default;}
  .node.tag .n-title{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:.08em; text-decoration:none;}
  .node.tag .n-sub{font-size:11px;}
  .node.blocked .n-title{color:var(--accent);}
  .node.code .n-title{font-family:'JetBrains Mono',monospace; font-size:13.5px;}

  .zone-label{position:absolute; font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:1.2px; pointer-events:none;}

  .arrow-label{position:absolute; font-family:'JetBrains Mono',monospace; font-size:10.3px; color:var(--ink-soft); background:rgba(255,255,255,.92); padding:1px 5px; white-space:nowrap; pointer-events:none; border-radius:2px;}
  .arrow-label.strong{color:var(--ink); font-weight:700;}
  .arrow-label.danger{color:var(--accent); font-weight:700;}
  .arrow-label.allow{color:var(--ok); font-weight:700;}
  .arrow-label.wrap{white-space:normal;}

  /* highlight states */
  .stage .traceable{transition:opacity .2s ease;}
  .stage.tracing .traceable{opacity:.13;}
  .stage.tracing .lit{opacity:1 !important;}
  .stage.tracing rect.lit{stroke-width:3.4px;}
  .stage.tracing polyline.lit{stroke-width:3.6px;}
  .stage.tracing .node.lit .n-title{text-decoration-color:var(--accent);}

  /* chip rail */
  .rail{display:flex; align-items:center; gap:6px; padding:8px 0 6px 0; flex-wrap:wrap; flex-shrink:0;}
  .rail .rl{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-right:4px;}
  .chip{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; padding:4px 8px; border:1.5px solid var(--ink); background:#fff; cursor:pointer; display:flex; gap:6px; align-items:center;}
  .chip .k{color:var(--muted); font-weight:500;}
  .chip .pl{font-size:9px; padding:0 4px; border:1px solid currentColor; letter-spacing:.06em;}
  .chip:hover{background:#F4F4F4;}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chip.active .k{color:#fff;}
  .chip:focus-visible{outline:3px solid var(--accent-soft); outline-offset:2px;}

  /* play caption */
  .caption{display:none; align-items:center; gap:14px; border:2px solid var(--ink); border-top:0; background:var(--ink); color:#fff; padding:8px 14px; flex-shrink:0;}
  .caption.show{display:flex;}
  .caption .step{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--accent-soft); white-space:nowrap;}
  .caption .txt{font-size:14px; font-weight:600; line-height:1.4; flex:1;}
  .caption .txt code{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#f2c46d;}
  .caption button{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; background:transparent; color:#fff; border:1.5px solid #fff; width:30px; height:26px; cursor:pointer;}
  .caption button:hover{background:#fff; color:var(--ink);}
  .caption .bar{position:relative; width:120px; height:4px; background:#444;}
  .caption .bar i{position:absolute; left:0; top:0; bottom:0; background:var(--accent); width:0; transition:width .25s ease;}

  footer{padding:6px 20px; border-top:1px solid #E0E0E0; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted); display:flex; justify-content:space-between; flex-shrink:0;}

  /* drawer */
  .backdrop{position:fixed; inset:0; background:rgba(26,26,26,.35); opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:20;}
  .backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{position:fixed; top:0; right:0; height:100%; width:min(480px,92vw); background:#fff; border-left:2px solid var(--ink); transform:translateX(100%); transition:transform .22s ease; z-index:21; display:flex; flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px 22px 14px 22px; border-bottom:1px solid #E0E0E0; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .drawer-head .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}
  .drawer-head h2{font-size:20px; font-weight:800; line-height:1.25;}
  .drawer-close{font-family:'JetBrains Mono',monospace; border:2px solid var(--ink); background:#fff; width:32px; height:32px; cursor:pointer; font-size:15px; flex-shrink:0;}
  .drawer-close:hover{background:var(--ink); color:#fff;}
  .drawer-body{padding:18px 22px 30px 22px; overflow-y:auto; font-size:14px; line-height:1.65; color:var(--ink-soft);}
  .drawer-body p{margin-bottom:12px;}
  .drawer-body b{color:var(--ink);}
  .drawer-body code,.drawer-body .mono{font-family:'JetBrains Mono',monospace; font-size:12.3px; color:var(--ink); background:#F4F4F4; padding:1px 5px;}
  .drawer-body ul{margin:0 0 12px 18px;}
  .drawer-body li{margin-bottom:6px;}
  .drawer-body h3{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; margin:16px 0 8px 0; color:var(--ink);}
  .drawer-body table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:12px;}
  .drawer-body th,.drawer-body td{border:1px solid #E0E0E0; padding:6px 8px; text-align:left; vertical-align:top;}
  .drawer-body th{font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink); width:34%;}
  .drawer-body pre{background:#1A1A1A; color:#E8E8E8; font-family:'JetBrains Mono',monospace; font-size:11.3px; line-height:1.55; padding:10px 12px; white-space:pre-wrap; word-break:break-all; margin-bottom:12px;}
  .drawer-body pre .d{color:#F28B7A; font-weight:700;}
  .callout{border:2px solid var(--ink); padding:10px 12px; margin-bottom:12px; font-family:'JetBrains Mono',monospace; font-size:12.3px; line-height:1.6; color:var(--ink);}
  .callout.hot{border-color:var(--accent); color:var(--accent);}
  .callout.ok{border-color:var(--ok); color:var(--ok);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header>
  <div class="htitle">
    <div class="kicker"><span class="dot"></span>07 — Architecture deep dive · interactive</div>
    <h1>Proven before it runs. Denied while it runs. Logged as evidence.</h1>
  </div>
  <div class="toolbar">
    <button class="tbtn" id="btn-reset">Reset</button>
    <span class="sep"></span>
    <button class="tbtn" data-trace="verify">Trace: verify run</button>
    <button class="tbtn" data-trace="developer">Developer plane</button>
    <button class="tbtn accent" data-trace="egress">Denied egress</button>
    <button class="tbtn accent" data-trace="kernel">Kernel denials</button>
    <button class="tbtn accent" data-trace="credential">Credential path</button>
    <button class="tbtn" data-trace="kyverno">Kyverno + MCP bonus</button>
    <span class="sep"></span>
    <button class="tbtn play" id="btn-play">▶ Play the run</button>
    <div class="zoomgroup">
      <button class="zbtn" id="zoom-out" aria-label="Zoom out">−</button>
      <span class="zlabel" id="zoom-label">100%</span>
      <button class="zbtn" id="zoom-in" aria-label="Zoom in">+</button>
      <button class="zfit" id="zoom-fit">Fit</button>
    </div>
  </div>
</header>

<main>
  <div class="canvas-scroll" id="canvasScroll">
    <div class="stage-sizer" id="stageSizer">
      <div class="stage" id="stage">
        <svg viewBox="0 0 1800 1080" role="img" aria-label="Six zones: operator laptop, OpenShell control plane, the untrusted sandbox, the trusted supervisor, the Kyverno bonus and the outside world, with every denied attempt marked where it is stopped.">
          <defs>
            <filter id="roughen" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
            </filter>
            <filter id="roughen-line" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="7" result="n2"/>
              <feDisplacementMap in="SourceGraphic" in2="n2" scale="2.4"/>
            </filter>
          </defs>

          <g id="bands"></g>
          <g id="arrows" fill="none"></g>
          <g id="boxes"></g>
          <g id="marks"></g>
        </svg>
        <div id="overlay" style="position:absolute; inset:0;"></div>
      </div>
    </div>
  </div>
  <div class="caption" id="caption">
    <span class="step" id="cap-step">STEP 1 / 10</span>
    <span class="txt" id="cap-txt"></span>
    <span class="bar"><i id="cap-bar"></i></span>
    <button id="cap-prev" aria-label="Previous step">◀</button>
    <button id="cap-next" aria-label="Next step">▶</button>
    <button id="cap-stop" aria-label="Stop">■</button>
  </div>
  <div class="rail" id="rail"><span class="rl">12 controls · keys 1–0, − = · ★ bonus</span></div>
</main>

<footer>
  <span>OPENSHELL AGENT GUARDRAILS — ARCHITECTURE DEEP DIVE · click any box · ✗ = where a request was stopped</span>
  <span>PAGE 07 / 20</span>
</footer>

<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <div>
      <div class="eyebrow" id="drawer-eyebrow">Detail</div>
      <h2 id="drawer-title">—</h2>
    </div>
    <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
/* ---------- zones ---------- */
const BANDS = [
  {y:0,   h:165, fill:'var(--zone-h)', line:'#b9b6aa', text:'#6d6a5f', label:'ZONE H — OPERATOR LAPTOP (make targets, grader)'},
  {y:165, h:180, fill:'var(--zone-c)', line:'#7fa88a', text:'#4d7a5b', label:'ZONE C — OPENSHELL CONTROL PLANE (trusted)'},
  {y:345, h:220, fill:'var(--zone-x)', line:'#c9857a', text:'#a8635a', label:'ZONE X — SANDBOX (untrusted: the agent lives here)'},
  {y:565, h:300, fill:'var(--zone-s)', line:'#c9ab6b', text:'#a1863f', label:'ZONE S — SUPERVISOR (trusted, one per sandbox: decides, enforces, logs)'},
  {y:865, h:215, fill:'var(--zone-e)', line:'#9787ad', text:'#6b5a80', label:'ZONE E — OUTSIDE WORLD', right:true},
];

/* ---------- nodes ---------- */
const GX = [60,248,436,624,812,1000], GW = 178;
const NODES = [
  // Zone H
  {id:'h-verify',   x:40,  y:34, w:280, h:112, z:'h', eyebrow:'Entrypoint', title:'make verify  /  make demo', sub:'gate → create sandbox → run attempts → read log → grade 12 rows'},
  {id:'h-setup',    x:340, y:34, w:250, h:112, z:'h', eyebrow:'One-time', title:'make setup', sub:'build image · GitHub profile · provider demo-github (FAKE token)'},
  {id:'h-preflight',x:610, y:34, w:250, h:112, z:'h', eyebrow:'Read-only checks', title:'make preflight', sub:'Docker ≥ 28 · host networking · OpenShell 0.1.3 · prover · ssh-keygen'},
  {id:'h-gate',     x:880, y:34, w:300, h:112, z:'h', eyebrow:'Developer plane', title:'Policy gate', sub:'openshell-prover: within_boundary? · reviewer + operator signatures'},
  {id:'h-grader',   x:1200,y:34, w:270, h:112, z:'h', eyebrow:'The judge', title:'verify.sh + evidence', sub:'12 rows · exact line per row · signed, hash-chained bundle'},
  {id:'h-kyverno',  x:1490,y:34, w:270, h:112, z:'h', eyebrow:'Bonus', title:'make kyverno / stop', sub:'guard + authz + fake MCP server · gateway.toml restored exactly'},

  // Zone C
  {id:'c-gateway',  x:40,  y:195, w:330, h:128, z:'c', eyebrow:'Control plane', title:'OpenShell gateway', sub:'https://localhost:17670 · creates sandboxes · rule proposals'},
  {id:'c-provider', x:400, y:195, w:300, h:128, z:'c', eyebrow:'Credentials', title:'Provider: demo-github', sub:'keeps the value · the sandbox gets a placeholder'},
  {id:'c-policy',   x:730, y:195, w:280, h:128, z:'c', eyebrow:'Policy · signed', title:'agent-policy.yaml', sub:'Landlock hard · uid 1000 · 2 read-only hosts, curl only', code:true},
  {id:'c-boundary', x:1040,y:195, w:250, h:128, z:'c', eyebrow:'Operator ceiling · signed', title:'org-boundary.yaml', sub:'what any agent policy may ever allow', code:true},
  {id:'c-audit',    x:1320,y:195, w:440, h:128, z:'c', eyebrow:'Evidence', title:'OCSF audit log', sub:'openshell logs <name> --source sandbox · NET: · HTTP: · FINDING:'},

  // Zone X
  {id:'x-agent',    x:40,  y:378, w:400, h:160, z:'x', eyebrow:'Untrusted', title:'Agent process · run_all.sh', sub:'uid 1000 · curl, python3, dig · one labelled attempt per control, fake data only'},
  {id:'x-landlock', x:470, y:378, w:330, h:160, z:'x', eyebrow:'Kernel', title:'Landlock filesystem view', sub:'read-only /usr /etc /bin /lib … · read-write /tmp · nothing else exists for the agent'},
  {id:'x-secret',   x:830, y:378, w:340, h:74,  z:'x', title:'/opt/company/prod.env', sub:'fake values · mode 0644, world-readable on purpose', code:true, blocked:true},
  {id:'x-env',      x:830, y:464, w:340, h:74,  z:'x', title:'GITHUB_TOKEN', sub:'= openshell:resolve:env:…  (placeholder)', code:true},
  {id:'x-kernel',   x:1230,y:378, w:250, h:160, z:'x', eyebrow:'Kernel', title:'Process identity', sub:'runs as uid/gid 1000 from the first instruction · setuid(0) → Operation not permitted'},
  {id:'x-tag',      x:1510,y:378, w:250, h:160, z:'x', tag:true, title:'RULE: UNTRUSTED BY DEFAULT', sub:'Nothing here can grant itself access. Every way out is the supervisor proxy or the kernel.'},

  // Zone S
  {id:'s-proxy',    x:40,  y:590, w:1150,h:255, z:'s', big:true, eyebrow:'Zone S · trusted · one per sandbox', title:'Supervisor: egress proxy + policy engine'},
  {id:'g-l4',    x:GX[0], y:650, w:GW, h:150, z:'s', gate:true, eyebrow:'Gate', title:'L4 default-deny', sub:'host:port + binary must match a policy, or DENIED'},
  {id:'g-dns',   x:GX[1], y:650, w:GW, h:150, z:'s', gate:true, eyebrow:'Gate', title:'Policy DNS', sub:'names not eligible under policy → NET:REFUSE'},
  {id:'g-binary',x:GX[2], y:650, w:GW, h:150, z:'s', gate:true, eyebrow:'Gate', title:'Binary identity', sub:'github_readonly lists /usr/bin/curl only'},
  {id:'g-l7',    x:GX[3], y:650, w:GW, h:150, z:'s', gate:true, eyebrow:'Gate', title:'L7 rules', sub:'read-only → GET / HEAD · MCP host: only POST /mcp'},
  {id:'g-cred',  x:GX[4], y:650, w:GW, h:150, z:'s', gate:true, eyebrow:'Gate', title:'Credential binding', sub:'placeholder resolves only on the bound host / port / path'},
  {id:'g-mw',    x:GX[5], y:650, w:GW, h:150, z:'s', gate:true, eyebrow:'Hook', title:'Middleware', sub:'EvaluateHttpRequest · PRE_CREDENTIALS · fail-closed'},

  // Zone K (inside S band, right side)
  {id:'k-guard', x:1250, y:612, w:510, h:96,  z:'k', eyebrow:'Bonus · my Go service', title:'kyverno-guard', sub:'gRPC :50061 · protocol 1.0 · forwards the request (and body) as raw HTTP/1.1'},
  {id:'k-authz', x:1250, y:738, w:510, h:104, z:'k', eyebrow:'Bonus · Kyverno', title:'kyverno-authz v0.4.0 · 2 CEL policies', sub:'github-read-path · mcp-tool-guard (tool allowlist, flag args, path traversal)'},

  // Zone E
  {id:'e-example', x:40,  y:900, w:200, h:135, z:'e', title:'example.com:443', sub:'no policy names it', code:true, blocked:true},
  {id:'e-meta',    x:260, y:900, w:210, h:135, z:'e', title:'169.254.169.254:80', sub:'cloud metadata address', code:true, blocked:true},
  {id:'e-invalid', x:490, y:900, w:200, h:135, z:'e', title:'not-eligible.invalid', sub:'reserved DNS name', code:true, blocked:true},
  {id:'e-github',  x:720, y:900, w:480, h:135, z:'e', title:'api.github.com:443', sub:'reads allowed (curl) · writes, python3, unbound credentials denied · bonus: one path only', code:true},
  {id:'e-httpbin', x:1230,y:900, w:260, h:135, z:'e', title:'httpbin.org:443', sub:'read-only allowed · NOT bound to the credential', code:true},
  {id:'e-mcp',     x:1520,y:900, w:240, h:135, z:'e', title:'fake MCP server', sub:'127.0.0.1:8766, seen as host.openshell.internal · canned results', code:true},
];

/* ---------- arrows ---------- */
const ARROWS = [
  // H <-> C
  {id:'a-create', pts:[[180,146],[180,195]], style:'strong', label:'sandbox create', lp:[188,152]},
  {id:'a-setup',  pts:[[465,146],[465,195]], style:'muted', label:'provider create', lp:[473,152]},
  {id:'a-gate-p', pts:[[930,146],[930,195]], style:'gate', label:'signature?', lp:[860,152]},
  {id:'a-gate-b', pts:[[1110,146],[1110,195]], style:'gate', label:'within_boundary?', lp:[1118,152]},
  {id:'a-logs',   pts:[[1400,195],[1400,146]], style:'muted-dash', label:'openshell logs', lp:[1408,152]},

ARROWS.forEach(a=>{

    l.style.left = a.lp[0]+'px'; l.style.top = a.lp[1]+'px';

});

];
let playIdx = -1, playTimer = null;
const cap = $('caption');
function showStep(i){
  playIdx = (i + STEPS.length) % STEPS.length;
  const s = STEPS[playIdx];
  light(s.ids);
  $('cap-step').textContent = `STEP ${playIdx+1} / ${STEPS.length}`;
  $('cap-txt').innerHTML = s.txt;
  $('cap-bar').style.width = ((playIdx+1)/STEPS.length*100)+'%';
}
function schedule(){ clearTimeout(playTimer); playTimer = setTimeout(()=>{ if(playIdx < STEPS.length-1){ showStep(playIdx+1); schedule(); } else { $('btn-play').classList.remove('active'); $('btn-play').textContent='▶ Play the run'; } }, 4200); }
function startPlay(){ closeDrawer(); clearUI(); activeTrace=null; cap.classList.add('show'); $('btn-play').classList.add('active'); $('btn-play').textContent='❚❚ Playing'; showStep(0); schedule(); requestAnimationFrame(refit); }
function stopPlay(){ if(playIdx<0) return; clearTimeout(playTimer); playIdx=-1; cap.classList.remove('show'); $('btn-play').classList.remove('active'); $('btn-play').textContent='▶ Play the run'; requestAnimationFrame(refit); }
$('btn-play').addEventListener('click', ()=>{ if(playIdx>=0 && $('btn-play').classList.contains('active')){ clearTimeout(playTimer); $('btn-play').classList.remove('active'); $('btn-play').textContent='▶ Resume'; } else if(playIdx>=0){ $('btn-play').classList.add('active'); $('btn-play').textContent='❚❚ Playing'; schedule(); } else startPlay(); });
$('cap-prev').addEventListener('click', ()=>{ showStep(playIdx-1); if($('btn-play').classList.contains('active')) schedule(); });
$('cap-next').addEventListener('click', ()=>{ showStep(playIdx+1); if($('btn-play').classList.contains('active')) schedule(); });
$('cap-stop').addEventListener('click', ()=>{ stopPlay(); light([]); });

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === 'Escape'){ closeDrawer(); return; }
  if(/^[0-9]$/.test(e.key)){ const i = e.key === '0' ? 9 : parseInt(e.key,10)-1; selectControl(i); }
  if(e.key === '-') selectControl(10);
  if(e.key === '=') selectControl(11);
});

/* ---------- zoom / fit ---------- */
const STAGE_W = 1800, STAGE_H = 1080;
const canvasScroll = $('canvasScroll'), stageSizer = $('stageSizer'), zoomLabel = $('zoom-label');
let zoom = 1, fitZoom = 1, userZoomed = false;
function computeFitZoom(){
  const w = canvasScroll.clientWidth - 4, h = canvasScroll.clientHeight - 4;
  if(w <= 0 || h <= 0) return 1;   // not laid out yet (hidden tab); refit on resize/load
  return Math.min(w/STAGE_W, h/STAGE_H, 1.25);
}
function applyZoom(z, opts){
  opts = opts || {};
  zoom = Math.max(fitZoom*0.4, Math.min(2.5, z));
  stage.style.transform = 'scale('+zoom+')';
  stageSizer.style.width = (STAGE_W*zoom)+'px'; stageSizer.style.height = (STAGE_H*zoom)+'px';
  zoomLabel.textContent = Math.round(zoom/fitZoom*100)+'%';
  if(!opts.silent) userZoomed = Math.abs(zoom-fitZoom) > 0.01;
}
function fitToScreen(){ fitZoom = computeFitZoom(); applyZoom(fitZoom,{silent:true}); userZoomed = false; }
function refit(){ fitZoom = computeFitZoom(); if(!userZoomed) applyZoom(fitZoom,{silent:true}); }
$('zoom-in').addEventListener('click', ()=>applyZoom(zoom*1.2));
$('zoom-out').addEventListener('click', ()=>applyZoom(zoom/1.2));
$('zoom-fit').addEventListener('click', fitToScreen);
canvasScroll.addEventListener('wheel', e=>{
  if(!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const before = zoom; applyZoom(zoom*(e.deltaY<0?1.1:1/1.1));
  const r = zoom/before;
  canvasScroll.scrollLeft = (canvasScroll.scrollLeft+e.offsetX)*r - e.offsetX;
  canvasScroll.scrollTop = (canvasScroll.scrollTop+e.offsetY)*r - e.offsetY;
},{passive:false});
window.addEventListener('resize', refit);
requestAnimationFrame(()=>requestAnimationFrame(fitToScreen));
// rAF doesn't fire in a hidden tab; fit on load as well.
window.addEventListener('load', fitToScreen);
setTimeout(fitToScreen, 60);
</script>
