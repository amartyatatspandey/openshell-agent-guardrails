('cap-next').addEventListener('click', ()=>{ showStep(playIdx+1); if($('btn-play').classList.contains('active')) schedule(); });\n$('cap-stop').addEventListener('click', ()=>{ stopPlay(); light([]); });\n\n/* ---------- keyboard ---------- */\ndocument.addEventListener('keydown', e=>{\n  if(e.altKey || e.ctrlKey || e.metaKey) return;\n  if(e.key === 'Escape'){ closeDrawer(); return; }\n  if(/^[0-9]$/.test(e.key)){ const i = e.key === '0' ? 9 : parseInt(e.key,10)-1; selectControl(i); }\n  if(e.key === '-') selectControl(10);\n  if(e.key === '=') selectControl(11);\n});\n\n/* ---------- zoom / fit ---------- */\nconst STAGE_W = 1800, STAGE_H = 1080;\nconst canvasScroll = $('canvasScroll'), stageSizer = $('stageSizer'), zoomLabel = $('zoom-label');\nlet zoom = 1, fitZoom = 1, userZoomed = false;\nfunction computeFitZoom(){\n  const w = canvasScroll.clientWidth - 4, h = canvasScroll.clientHeight - 4;\n  if(w <= 0 || h <= 0) return 1;   // not laid out yet (hidden tab); refit on resize/load\n  return Math.min(w/STAGE_W, h/STAGE_H, 1.25);\n}\nfunction applyZoom(z, opts){\n  opts = opts || {};\n  zoom = Math.max(fitZoom*0.4, Math.min(2.5, z));\n  stage.style.transform = 'scale('+zoom+')';\n  stageSizer.style.width = (STAGE_W*zoom)+'px'; stageSizer.style.height = (STAGE_H*zoom)+'px';\n  zoomLabel.textContent = Math.round(zoom/fitZoom*100)+'%';\n  if(!opts.silent) userZoomed = Math.abs(zoom-fitZoom) > 0.01;\n}\nfunction fitToScreen(){ fitZoom = computeFitZoom(); applyZoom(fitZoom,{silent:true}); userZoomed = false; }\nfunction refit(){ fitZoom = computeFitZoom(); if(!userZoomed) applyZoom(fitZoom,{silent:true}); }\n$('zoom-in').addEventListener('click', ()=>applyZoom(zoom*1.2));\n$('zoom-out').addEventListener('click', ()=>applyZoom(zoom/1.2));\n$('zoom-fit').addEventListener('click', fitToScreen);\ncanvasScroll.addEventListener('wheel', e=>{\n  if(!(e.ctrlKey || e.metaKey)) return;\n  e.preventDefault();\n  const before = zoom; applyZoom(zoom*(e.deltaY<0?1.1:1/1.1));\n  const r = zoom/before;\n  canvasScroll.scrollLeft = (canvasScroll.scrollLeft+e.offsetX)*r - e.offsetX;\n  canvasScroll.scrollTop = (canvasScroll.scrollTop+e.offsetY)*r - e.offsetY;\n},{passive:false});\nwindow.addEventListener('resize', refit);\nrequestAnimationFrame(()=>requestAnimationFrame(fitToScreen));\n// rAF doesn't fire in a hidden tab; fit on load as well.\nwindow.addEventListener('load', fitToScreen);\nsetTimeout(fitToScreen, 60);\n<\/script>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Shared slide styles. build.py inlines this file into every slide. */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { background: #FFFFFF; }\n.slide-container {\n  width: 1280px; height: 720px; background: #FFFFFF; overflow: hidden;\n  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #1A1A1A;\n  display: flex; flex-direction: column; position: relative;\n}\n.accent-rule { width: 1280px; height: 3px; background: #D9381E; flex-shrink: 0; }\n.inner { padding: 36px 72px 0 72px; flex: 1; display: flex; flex-direction: column; min-height: 0; }\n.kicker {\n  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.12em;\n  color: #1A1A1A; text-transform: uppercase; margin-bottom: 10px;\n}\n.kicker::before {\n  content: \"\"; display: inline-block; width: 7px; height: 7px; background: #D9381E;\n  margin-right: 10px; vertical-align: middle; margin-bottom: 2px;\n}\n.kicker span { color: #8a8a8a; }\nh1 { font-weight: 900; font-size: 42px; line-height: 1.04; letter-spacing: -0.015em; margin-bottom: 20px; }\nh1 .hl, .hl { color: #D9381E; }\n.lede { font-size: 17px; line-height: 1.5; color: #333333; max-width: 1040px; margin-bottom: 18 ht: 1.46; padding: 12px 16px; }\n  .notes { gap: 8px; }\n  .note { padding: 8px 14px; }\n  .strip { margin-top: 12px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">08 — The box <span>· policies/openshell/agent-policy.yaml<\/span><\/div>\n    <h1>The whole policy: four decisions, all deny-by-default<\/h1>\n    <div class=\"grid\">\n<div class=\"term\"><span class=\"n\">1<\/span><span class=\"k\">filesystem_policy:<\/span>\n  read_only:  [/bin, /usr, /lib, /proc,\n               /dev/urandom, /etc, /var/log]\n  read_write: [/tmp, /dev/null]\n<span class=\"k\">landlock:<\/span>\n  compatibility: <span class=\"d\">hard_requirement<\/span>\n\n<span class=\"n\">2<\/span><span class=\"k\">process:<\/span>\n  run_as_user: <span class=\"g\">\"1000\"<\/span>\n  run_as_group: <span class=\"g\">\"1000\"<\/span>\n\n<span class=\"n\">3<\/span><span class=\"k\">network_policies:<\/span>\n  github_readonly:\n    endpoints:\n      - host: api.github.com   port: 443\n        protocol: rest   enforcement: enforce\n        access: <span class=\"d\">read-only<\/span>\n    binaries: [ <span class=\"g\">/usr/bin/curl<\/span> ]\n  public_echo:          <span class=\"m\"># httpbin.org, same shape<\/span>\n\n<span class=\"n\">4<\/span><span class=\"m\"># provider demo-github, attached at create:<\/span>\n  GITHUB_TOKEN=<span class=\"d\">FAKE_NOT_A_REAL_TOKEN<\/span><\/div>\n      <div class=\"notes\">\n        <div class=\"note\"><div class=\"n\">1<\/div><div><h3>Landlock, and no silent downgrade<\/h3><p>The agent sees a short read-only list and <code>/tmp<\/code>. <code>hard_requirement<\/code> means: if the kernel can't enforce Landlock, the sandbox doesn't start at all.<\/p><\/div><\/div>\n        <div class=\"note\"><div class=\"n\">2<\/div><div><h3>Never root<\/h3><p>The workload runs as uid/gid 1000 from the first instruction.<\/p><\/div><\/div>\n        <div class=\"note\"><div class=\"n\">3<\/div><div><h3>Two hosts, read-only, curl only<\/h3><p>Anything not listed is denied. <code>read-only<\/code> denies writes by method. The binary list means python3 to the same host is still a deny.<\/p><\/div><\/div>\n        <div class=\"note\"><div class=\"n\">4<\/div><div><h3>A credential that can't leak<\/h3><p>The gateway keeps the value. The sandbox gets a placeholder that only resolves on the bound endpoint.<\/p><\/div><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"strip\">\n      <div class=\"tag\">Proof design<\/div>\n      <div class=\"text\">The image plants <code>/opt/company/prod.env<\/code> (fake values) and runs <b><code>chmod 0644<\/code><\/b>, so it's world-readable. Unix permissions would allow the read. <b>When it's denied, only Landlock could have done it.<\/b> The demo proves the control, not an accident of <code>chmod<\/code>.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>OPENSHELL AGENT GUARDRAILS · AMARTYA PANDEY<\/span>\n    <span>PAGE 08 / 20<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Shared slide styles. build.py inlines this file into every slide. */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { background: #FFFFFF; }\n.slide-container {\n  width: 1280px; height: 720px; background: #FFFFFF; overflow: hidden;\n  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #1A1A1A;\n  display: flex; flex-direction: column; position: relative;\n}\n.accent-rule { width: 1280px; height: 3px; background: #D9381E; flex-shrink: 0; }\n.inner { padding: 36px 72px 0 72px; flex: 1; display: flex; flex-direction: column; min-height: 0; }\n.kicker {\n  font-family: 'JetB ight: 700; }\n.term .m { color: #8a8a8a; }\n.term .k { color: #f2c46d; }\n\n/* small pills */\n.pill {\n  display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;\n  letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border: 1.5px solid #1A1A1A;\n}\n.pill.red { border-color: #D9381E; color: #D9381E; }\n.pill.fill { background: #1A1A1A; color: #FFFFFF; }\n.pill.ok { border-color: #4d7a5b; color: #4d7a5b; }\n\n.footer {\n  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;\n  padding: 10px 72px 14px 72px; border-top: 1px solid #E0E0E0; margin-top: auto;\n}\n.footer span { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #999999; letter-spacing: 0.06em; }\n.footer .poc { color: #D9381E; font-weight: 700; }\n<\/style>\n<style>\n  h1 { margin-bottom: 14px; }\n  .pipe { display: grid; grid-template-columns: repeat(6, 1fr); border: 2px solid #1A1A1A; }\n  .pipe div { padding: 9px 10px; border-right: 1px solid #E0E0E0; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.4; position: relative; }\n  .pipe div:last-child { border-right: 0; background: #1A1A1A; color: #fff; }\n  .pipe div b { display: block; font-size: 10.5px; color: #D9381E; letter-spacing: 0.1em; margin-bottom: 2px; }\n  .grid { display: grid; grid-template-columns: 250px 1fr; gap: 16px; margin-top: 14px; }\n  .score { background: #1A1A1A; color: #fff; padding: 16px 20px; display: flex; flex-direction: column; justify-content: center; }\n  .score .num { font-family: 'JetBrains Mono', monospace; font-size: 68px; font-weight: 700; line-height: 1; }\n  .score .num span { color: #F28B7A; }\n  .score .lbl { font-size: 14px; font-weight: 800; margin-top: 8px; line-height: 1.35; }\n  .score .ex { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #bbb; margin-top: 10px; line-height: 1.6; }\n  .term { font-size: 11px; line-height: 1.65; padding: 10px 14px; }\n  .cases { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 14px; }\n  .case { border: 2px solid #1A1A1A; padding: 10px 14px; }\n  .case h3 { font-size: 14.5px; font-weight: 800; margin-bottom: 4px; }\n  .case p { font-size: 12.5px; line-height: 1.45; color: #333; }\n  /* sizing pass: fill the 720px frame */\n  .pipe div { padding: 13px 12px; font-size: 12.8px; }\n  .grid { margin-top: 18px; }\n  .score .num { font-size: 80px; }\n  .term { font-size: 12.3px; line-height: 1.85; padding: 14px 16px; }\n  .cases { margin-top: 20px; gap: 16px; }\n  .case { padding: 14px 16px; }\n  .case h3 { font-size: 16.5px; }\n  .case p { font-size: 14px; }\n  /* sizing pass */\n  .term { font-size: 11.3px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">11 — Verification <span>· verify.sh<\/span><\/div>\n    <h1>Verification, not vibes<\/h1>\n    <div class=\"pipe\">\n      <div><b>01<\/b>preflight → policy gate (proof + signatures)<\/div>\n      <div><b>02<\/b>sandbox create --policy --provider<\/div>\n      <div><b>03<\/b>run_all.sh inside the sandbox<\/div>\n      <div><b>04<\/b>openshell logs --source sandbox<\/div>\n      <div><b>05<\/b>regex per row in expected_events.tsv<\/div>\n      <div><b>06<\/b>PASS/FAIL matrix + exit code<\/div>\n    <\/div>\n    <div class=\"grid\">\n      <div class=\"score\">\n        <div class=\"num\">12<span>/<\/span>0<\/div>\n        <div class=\"lbl\">PASS / FAIL, fresh run<\/div>\n        <div class=\"ex\">exit 0 · all rows matched<br>exit 1 · any row failed<br>exit 2 · setup/probe error<br>gate refused · no sandbox<\/div>\n      <\/div>\n<div class=\"term\"><span class=\"m\"># openshell logs guardrails-demo --source sandbox   (real output, trimmed)<\/span>\nHTTP:GET [HIGH] <span class=\"d\">DENIED<\/span> GET  [policy:public_echo engine:credential-binding] [reason:credential_endpoint_mismatch]\nFINDING:<span class=\"d\">BLOCKED<\/span> [HIGH] \"Provider credential used at an unauthorized endpoint\"\nNET:OPEN [MED] <span class=\"d\">DENIED<\/span> /usr/bin/curl(0) -> example.com:443 [reason:transparent_tcp_policy_denied]\nNET:REFUSE [MED] <span class=\"d\">DENIED<\/span> not-eligible.invalid [reason:policy_dns_ineligible]\nNET:OPEN [MED] <span class=\"d\">DENIED<\/span> /usr/bin/curl(0) -> 169.254.169.254:80 [reason:transparent_tcp_policy_denied]\nHTTP:DELETE [MED] <span class=\"d\">DENIED<\/span> DELETE http://api.github.com:443/repos/example-org/… [policy:github_readonly engine:l7]\nHTTP:POST [MED] <span class=\"d\">DENIED<\/span> POST http://api.github.com:443/repos/example-org/…/issues [policy:github_readonly engine:l7]\nNET:OPEN [MED] <span class=\"d\">DENIED<\/span> /usr/bin/python3.12(0) -> api.github.com:443 [reason:transparent_tcp_policy_denied]\nPOLICY-GATE boundary <span class=\"g\">within_boundary<\/span> · signature <span class=\"g\">valid<\/span>\n<span class=\"g\">12 PASS, 0 FAIL (12 rows)<\/span><\/div>\n    <\/div>\n    <div class=\"cases\">\n      <div class=\"case\"><h3>Patterns from real output<\/h3><p>Every regex was checked against captured OpenShell lines. <code>tests/fixtures/<\/code> holds real logs, not synthetic ones.<\/p><\/div>\n      <div class=\"case\"><h3>The grader can fail<\/h3><p>A fixture with the egress line removed makes <code>verify.sh<\/code> exit <b>1<\/b>. A green run is only green if it could have been red.<\/p><\/div>\n      <div class=\"case\"><h3>Run the way you'll run it<\/h3><p>Re-run end to end from a fresh clone before pushing. That's how I caught the preflight bug on slide 19.<\/p><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>OPENSHELL AGENT GUARDRAILS · AMARTYA PANDEY<\/span>\n    <span>PAGE 11 / 20<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://font -items: center; flex-shrink: 0;\n  padding: 10px 72px 14px 72px; border-top: 1px solid #E0E0E0; margin-top: auto;\n}\n.footer span { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #999999; letter-spacing: 0.06em; }\n.footer .poc { color: #D9381E; font-weight: 700; }\n<\/style>\n<style>\n  .cases { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }\n  .case { border: 2px solid #1A1A1A; display: flex; flex-direction: column; }\n  .case .hd { padding: 10px 16px; border-bottom: 2px solid #1A1A1A; display: flex; justify-content: space-between; align-items: center; }\n  .case .hd .id { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; }\n  .case .bd { padding: 12px 16px; }\n  .case .row { display: grid; grid-template-columns: 96px 1fr; gap: 10px; margin-bottom: 8px; font-size: 13.5px; line-height: 1.45; color: #333; }\n  .case .row .k { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #D9381E; padding-top: 2px; }\n  .term { font-size: 11.5px; padding: 8px 12px; margin-top: 4px; }\n  .rule { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; border: 2px solid #1A1A1A; }\n  .rule div { padding: 10px 14px; border-right: 1px solid #E0E0E0; font-size: 13px; line-height: 1.45; color: #333; }\n  .rule div:last-child { border-right: 0; }\n  .rule b { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }\n  .strip { margin-top: 14px; }\n  /* sizing pass: fill the 720px frame */\n  .case .row { font-size: 14.5px; margin-bottom: 10px; }\n  .case .bd { padding: 14px 18px; }\n  .rule div { font-size: 14px; padding: 12px 16px; }\n  .rule { margin-top: 20px; }\n  .strip { margin-top: 18px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">12 — Honest evidence<\/div>\n    <h1>Two rows look different, and I'd rather show you why<\/h1>\n    <div class=\"cases\">\n      <div class=\"case\">\n        <div class=\"hd\"><span class=\"id\">fs-secret-denied<\/span><span class=\"pill red\">Kernel · Landlock<\/span><\/div>\n        <div class=\"bd\">\n          <div class=\"row\"><span class=\"k\">What<\/span><span>Read <code>/opt/company/prod.env<\/code>, a file that is mode 0644.<\/span><\/div>\n          <div class=\"row\"><span class=\"k\">Why not in log<\/span><span>Landlock denials are runtime events. OpenShell doesn't push them to the gateway stream that <code>verify.sh<\/code> reads.<\/span><\/div>\n          <div class=\"row\"><span class=\"k\">Graded by<\/span><span>The attempt has to fail with <i>Permission denied<\/i>. If the read succeeds, it prints NOT-BLOCKED.<\/span><\/div>\n<div class=\"term\"><span class=\"m\">$<\/span> cat /opt/company/prod.env  <span class=\"m\">→ Permission denied<\/span>\nPROBE fs-secret-denied <span class=\"d\">BLOCKED<\/span><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"case\">\n        <div class=\"hd\"><span class=\"id\">priv-nonroot-denied<\/span><span class=\"pill red\">Kernel · uid 1000<\/span><\/div>\n        <div class=\"bd\">\n          <div class=\"row\"><span class=\"k\">What<\/span><span>Try to become root: <code>os.setuid(0)<\/code>.<\/span><\/div>\n          <div class=\"row\"><span class=\"k\">Why not in log<\/span><span>Identity is set when the process starts. A refused <code>setuid<\/code> produces no supervisor event in the shapes this demo grades.<\/span><\/div>\n          <div class=\"row\"><span class=\"k\">Graded by<\/span><span>The attempt has to raise <i>Operation not permitted<\/i>. Anything else is NOT-BLOCKED.<\/span><\/div>\n<div class=\"term\"><span class=\"m\">$<\/span> python3 -c 'os.setuid(0)'  <span class=\"m\">→ PermissionError<\/span>\nPROBE priv-nonroot-denied <span class=\"d\">BLOCKED<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"rule\">\n      <div><b>Fail-safe direction<\/b>BLOCKED prints only on an observed error. Silence or success counts as a fail.<\/div>\n      <div><b>Same exit rules<\/b>Either row failing makes <code>make verify<\/code> exit 1, the same as a missing log line.<\/div>\n      <div><b>Labelled in the matrix<\/b>The <code>kind<\/code> column says <code>exit-code<\/code>, not <code>log<\/code>. No pretending.<\/div>\n    <\/div>\n    <div class=\"strip\">\n      <div class=\"tag ink\">Why it matters<\/div>\n      <div class=\"text\">I expected these lines in the log and they weren't there. I didn't fake a match. I checked the docs and the source, then <b>graded them by the strongest evidence that actually exists<\/b>, and labelled it.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>OPENSHELL AGENT GUARDRAILS · AMARTYA PANDEY<\/span>\n    <span>PAGE 12 / 20<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Shared slide styles. build.py inlines this file into every slide. */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { background: #FFFFFF; }\n.slide-container {\n  width: 1280px; height: 720px; background: #FFFFFF; overflow: hidden;\n  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #1A1A1A;\n  display: flex; flex-direction: column; position: relative;\n}\n.accent-rule { width: 1280px; height: 3px; background: #D9381E; flex-shrink: 0; }\n.inner { padding: 36px 72px 0 72px; flex: 1; display: flex; flex-direction: column; min-height: 0; }\n.kicker {\n  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.12em;\n  color: #1A1A1A; text-transform: uppercase; margin-bottom: 10px;\n}\n.kicker::before {\n  content: \"\"; display: inline-block; width: 7px; height: 7px; background: #D9381E;\n  margin-right: 10px; vertical-align: middle; margin-bottom: 2px;\n}\n.kicker span { color: #8a8a8a; }\nh1 { font-weight: 900; font-size: 42px; line-height: 1.04; letter-spacing: -0.015em; margin-bottom: 20px; }\nh1 .hl, .hl { color: #D9381E; }\n.lede { font-size: 17px; line-height: 1.5; color: #333333; max-width: 1040px; margin-bottom: 18px; }\n.mono, code { font-family: 'JetBrains Mono', monospace; }\ncode { font-size: 0.9em; background: #F4F4F4; padding: 1px 5px; color: #1A1A1A; }\nb { color: #1A1A1A; }\n\n/* bordered box with a black label bar */\n.box { border: 2px solid #1A1A1A; display: flex; flex-direction: column; }\n.box > .label {\n  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em;\n  text-transform: uppercase; background: #1A1A1A; color: #FFFFFF; padding: 8px 14px;\n  display: flex; justify-content: space-between; align-items: center;\n}\n.box > .label.red { background: #D9381E; }\n.box > .label.light { background: #FFFFFF; color: #1A1A1A; border-bottom: 2px solid #1A1A1A; }\n.box > .body { padding: 14px 18px 16px 18px; font-size: 14.5px; line-height: 1.55; color: #333333; flex: 1; }\n.box > .body p + p { margin-top: 8px; }\n\n/* strip: red tag + text */\n.strip { border: 2px solid #1A1A1A; display: flex; align-items: stretch; }\n.strip .tag {\n  background: #D9381E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 12px;\n  font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 12px 16px;\n  display: flex; align-items: center; flex-shrink: 0;\n}\n.strip .tag.ink { background: #1A1A1A; }\n.strip .text { padding: 12px 20px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; color: #333333; }\n.strip .text b { color: #1A1A1A; }\n\n.eyebrow {\n  font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em;\n  text-transform: uppercase; color: #D9381E; margin-bottom: 6px;\n}\n.cols { display: grid; gap: 18px; }\n.c2 { grid-template-columns: 1fr 1fr; }\n.c3 { grid-template-columns: 1fr 1fr 1fr; }\n.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }\n\n/* log / code block */\n.term {\n  background: #1A1A1A; color: #E8E8E8; font-family: 'JetBrains Mono', monospace; font-size: 12px;\n  line-height: 1.6; padding: 12px 16px; white-space: pre; overflow: hidden;\n}\n.term .d { color: #F28B7A; font-weight: 700; }\n.term .g { color: #9fd3a8; font-weight: 700; }\n.term .m { color: #8a8a8a; }\n.term .k { color: #f2c46d; }\n\n/* small pills */\n.pill {\n  display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;\n  letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border: 1.5px solid #1A1A1A;\n}\n.pill.red { border-color: #D9381E; color: #D9381E; }\n.pill.fill { background: #1A1A1A; color: #FFFFFF; }\n.pill.ok { border-color: #4d7a5b; color: #4d7a5b; }\n\n.footer {\n  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;\n  padding: 10px 72px 14px 72px; border-top: 1px solid #E0E0E0; margin-top: auto;\n}\n.footer span { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #999999; letter-spacing: 0.06em; }\n.footer .poc { color: #D9381E; font-weight: 700; }\n<\/style>\n<style>\n  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }\n  .lane { border: 2px solid #1A1A1A; display: flex; flex-direction: column; }\n  .lane .hd { padding: 9px 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; }\n  .lane.ok .hd { background: #4d7a5b; } .lane.no .hd { background: #D9381E; }\n  .seq { padding: 12px 14px; display: flex; flex-direction: column; gap: 0; }\n  .s { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: start; padding: 7px 0; border-bottom: 1px dashed #DDD; font-size: 13px; line-height: 1.4; color: #333; }\n  .s:last-child { border-bottom: 0; }\n  .s .who { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #1A1A1A; padding-top: 1px; }\n  .s code { font-size: 11.5px; }\n  .s.end { font-weight: 700; color: #1A1A1A; }\n  .lane.no .s.end { color: #D9381E; }\n  .lane.ok .s.end { color: #4d7a5b; }\n  .term { font-size: 11.5px; padding: 9px 14px; margin-top: 14px; }\n  .key { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }\n  .key div { border-top: 4px solid #1A1A1A; padding-top: 7px; font-size: 13px; line-height: 1.45; color: #333; }\n  .key b { display: block; font-size: 15px; margin-bottom: 2px; }\n  /* sizing pass: fill the 720px frame */\n  .s { font-size: 14.8px; padding: 11px 0; grid-template-columns: 124px 1fr; }\n  .s .who { font-size: 11.5px; }\n  .s code { font-size: 12.5px; }\n  .lane .hd { padding: 11px 16px; font-size: 13px; }\n  .seq { padding: 14px 16px; }\n  .term { font-size: 12.5px; padding: 12px 16px; margin-top: 18px; }\n  .key { margin-top: 20px; gap: 18px; }\n  .key div { font-size: 14.5px; }\n  .key b { font-size: 16.5px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">13 — The credential idea <span>· the most AIControls-shaped control<\/span><\/div>\n    <h1>The agent can hold a credential and still can't leak it<\/h1>\n    <div class=\"lanes\">\n      <div class=\"lane ok\">\n        <div class=\"hd\">Bound endpoint · allowed<\/div>\n        <div class=\"seq\">\n          <div class=\"s\"><span class=\"who\">Sandbox env<\/span><span><code>GITHUB_TOKEN=openshell:resolve:env:…<\/code> a placeholder, not the value<\/span><\/div>\n          <div class=\"s\"><span class=\"who\">Agent<\/span><span>curl GET to <code>api.github.com:443<\/code><\/span><\/div>\n          <div class=\"s\"><span class=\"who\">Supervisor<\/span><span>Host, port and path match the <code>demo-github<\/code> profile, so the real value is swapped in at the proxy<\/span><\/div>\n          <div class=\"s end\"><span class=\"who\">Result<\/span><span>Request goes out. The secret was never inside the sandbox.<\/span><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"lane no\">\n        <div class=\"hd\">Any other endpoint · denied<\/div>\n        <div class=\"seq\">\n          <div class=\"s\"><span class=\"who\">Agent<\/span><span>Sends the same placeholder to <code>httpbin.org<\/code>, a host the <b>network policy allows<\/b><\/span><\/div>\n          <div class=\"s\"><span class=\"who\">Supervisor<\/span><span>Not the endpoint the credential is bound to, so it refuses to resolve it<\/span><\/div>\n          <div class=\"s\"><span class=\"who\">OpenShell log<\/span><span>HTTP:GET <b>DENIED<\/b> <code>engine:credential-binding<\/code> plus a <b>FINDING:BLOCKED<\/b> [HIGH]<\/span><\/div>\n          <div class=\"s end\"><span class=\"who\">Result<\/span><span>Nothing leaves with the credential. Two rows PASS.<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n<div class=\"term\">HTTP:GET [HIGH] <span class=\"d\">DENIED<\/span> GET  [policy:public_echo engine:credential-binding] [reason:<span class=\"d\">credential_endpoint_mismatch<\/span>]\nFINDING:<span class=\"d\">BLOCKED<\/span> [HIGH] \"Provider credential used at an unauthorized endpoint\" [type:openshell.provider_credential.endpoint_mismatch]<\/div>\n    <div class=\"key\">\n      <div><b>Network allow ≠ credential allow<\/b>httpbin.org is reachable, but the credential still won't resolve there.<\/div>\n      <div><b>Structural, not policed<\/b>Leaking it isn't detected afterwards. It can't happen.<\/div>\n      <div><b>Fleet relevance<\/b>Exactly the leaked-token incident class AIControls governs on the MCP plane.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>OPENSHELL AGENT GUARDRAILS · AMARTYA PANDEY<\/span>\n    <span>PAGE 13 / 20<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Shared slide styles. build.py inlines this file into every slide. */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { background: #FFFFFF; }\n.slide-container {\n  width: 1280px; height: 720px; background: #FFFFFF; overflow: hidden;\n  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #1A1A1A;\n  display: flex; flex-direction: column; position: relative;\n}\n.accent-rule { width: 1280px; height: 3px; background: #D9381E; flex-shrink: 0; }\n.inner { padding: 36px 72px 0 72px; flex: 1; display: flex; flex-direction: column; min-height: 0; }\n.kicker {\n  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.12em;\n  color: #1A1A1A; text-transform: uppercase; margin-bottom: 10px;\n}\n.kicker::before {\n  content: \"\"; display: inline-block; width: 7px; height: 7px; background: #D9381E;\n  margin-right: 10px; vertical-align: middle; margin-bottom: 2px;\n}\n.kicker span { color: #8a8a8a; }\nh1 { font-weight: 900; font-size: 42px; line-height: 1.04; letter-spacing: -0.015em; margin-bottom: 20px; }\nh1 .hl, .hl { color: #D9381E; }\n.lede { font-size: 17px; line-height: 1.5; color: #333333; max-width: 1040px; margin-bottom: 18px; }\n.mono, code { font-family: 'JetBrains Mono', monospace; }\ncode { font-size: 0.9em; background: #F4F4F4; padding: 1px 5px; color: #1A1A1A; }\nb { color: #1A1A1A; }\n\n/* bordered box with a black label bar */\n.box { border: 2px solid #1A1A1A; display: flex; flex-direction: column; }\n.box > lass=\"hop ky\"><div class=\"who\">kyverno-guard · Go<\/div><h3>My middleware<\/h3><p>Protocol 1.0 handshake. Rebuilds the request as raw HTTP/1.1 and asks Kyverno.<\/p><div class=\"port\">gRPC :50061<\/div><\/div>\n      <div class=\"hop ky\"><div class=\"who\">kyverno-authz v0.4.0<\/div><h3>CEL ValidatingPolicy<\/h3><p>Sees method, host, path, headers and body. Answers 200 or 403 with a reason.<\/p><div class=\"port\">HTTP :9081 · --nested-request<\/div><\/div>\n      <div class=\"hop os\"><div class=\"who\">OpenShell<\/div><h3>Enforces + logs it<\/h3><p>403 becomes DENY with Kyverno's reason code, in OpenShell's own audit log.<\/p><div class=\"port\">engine:middleware<\/div><\/div>\n    <\/div>\n    <div class=\"grid\">\n<div class=\"term\"><span class=\"m\"># bonus/kyverno-guard/policy/github-read-path.yaml<\/span>\napiVersion: <span class=\"k\">policies.kyverno.io/v1alpha1<\/span>\nkind: ValidatingPolicy\nspec:\n  evaluation: { mode: HTTP }\n  matchConditions:   <span class=\"m\"># only its own traffic (slide 16)<\/span>\n  - expression: object.attributes.host == \"api.github.com\"\n  validations:\n  - expression: &gt;\n      object.attributes.host == \"api.github.com\" &amp;&amp;\n      !(object.attributes.method in [\"GET\",\"HEAD\"] &amp;&amp;\n        object.attributes.path == \"/repos/example-org/example-repo\")\n        ? http.<span class=\"d\">Denied(\"kyverno_path_denied\")<\/span>.Response()\n        : http.<span class=\"g\">Allowed()<\/span>.Response()<\/div>\n      <div class=\"facts\">\n        <div class=\"fact\"><b>One rule set at the point the agent acts.<\/b> That's the AIControls idea, wired to NVIDIA's runtime to see if it holds. It does.<\/div>\n        <div class=\"fact\"><b>Layered, not replaced.<\/b> DELETE and POST never reach Kyverno, because OpenShell's L7 rule denies them first. <b>Next slide:<\/b> the same hook deciding MCP tool calls.<\/div>\n        <div class=\"fact\"><b>Fail-closed.<\/b> If Kyverno is unreachable, the request is denied.<\/div>\n        <div class=\"fact\"><b>Leaves your machine as it found it.<\/b> <code>make kyverno-stop<\/code> restores <code>gateway.toml<\/code> byte-identical. I checked.<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"out\">\n<div class=\"term\"><span class=\"g\">ALLOW<\/span> sandbox=guardrails-kyverno GET api.github.com/repos/example-org/example-repo\n<span class=\"d\">DENY <\/span> sandbox=guardrails-kyverno GET api.github.com/repos/example-org/example-repo/contents/.env reason=kyverno_path_denied\nHTTP:GET [MED] <span class=\"d\">DENIED<\/span> … [engine:middleware] [reason:<span class=\"d\">middleware_denied:kyverno_guard:kyverno_path_denied<\/span>]<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>OPENSHELL AGENT GUARDRAILS · AMARTYA PANDEY<\/span>\n    <span>PAGE 15 / 20<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Shared slide styles. build.py inlines this file into every slide. */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { background: #FFFFFF; }\n.slide-container {\n  width: 1280px; height: 720px; background: #FFFFFF; overflow: hidden;\n  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #1A1A1A;\n  display: flex; flex-direction: column; position: relative;\n}\n.accent-rule { width: 1280px; height: 3px; background: #D9381E; flex-shrink: 0; }\n.inner { padding: 36px 72px 0 72px; flex: 1; display: flex; flex-direction: column; min-height: 0; }\n.kicker {\n  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.12em;\n  color: #1A1A1A; text-transform: uppercase; margin-bottom: 10px;\n}\n.kicker::before {\n  content: \"\"; display: inl pass */\n  .term { font-size: 12.6px; line-height: 1.85; padding: 16px 18px; }\n  .what li { font-size: 14.6px; padding: 7px 0 7px 16px; }\n  .what li::before { top: 13px; }\n  .chain { font-size: 13.4px; margin-top: 16px; padding: 12px 16px; }\n  .strip { margin-top: 20px; }\n  .strip .text { font-size: 14px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">17 — Compliance domain <span>· make evidence · make evidence-verify<\/span><\/div>\n    <h1>Evidence you can check after the fact<\/h1>\n    <div class=\"grid\">\n      <div>\n        <div class=\"what\">\n          <div class=\"label\">.out/evidence/evidence-&lt;UTC&gt;.json<\/div>\n          <ul>\n            <li>OpenShell, prover and Docker versions, and the image ID<\/li>\n            <li>SHA-256 of the policy, both signatures, the boundary, the expectations table, the probes, the grader<\/li>\n            <li>The policy-gate output and the prover's JSON<\/li>\n            <li>Every graded row with the <b>exact line<\/b> that proved it<\/li>\n            <li>Signed with the review key, namespace <code>openshell-evidence<\/code><\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"chain\">h<sub>0<\/sub> = sha256(\"openshell-guardrails-evidence-v1\")<br>h<sub>i<\/sub> = sha256(h<sub>i−1<\/sub> ‖ id ‖ result ‖ evidence line)<br><span class=\"m\">change, drop or reorder a row → every later hash changes<\/span><\/div>\n      <\/div>\n<div class=\"term\"><span class=\"m\">$ make evidence<\/span>\n12 PASS, 0 FAIL (12 rows)\nevidence: 12 PASS, 0 FAIL (12 rows), chain head 786b0cff38b53d79…\nsigned:   .out/evidence/evidence-20261014T061039Z.json.sig\n\n<span class=\"m\">$ make evidence-verify<\/span>\nsignature: <span class=\"g\">valid<\/span> (openshell-policy-review)\nchain:     <span class=\"g\">intact<\/span>, 12 rows, 12 PASS / 0 FAIL\nfiles:     unchanged since the run\n\n<span class=\"m\">$ # flip px;\n}\n.kicker span { color: #8a8a8a; }\nh1 { font-weight: 900; font-size: 42px; line-height: 1.04; letter-spacing: -0.015em; margin-bottom: 20px; }\nh1 .hl, .hl { color: #D9381E; }\n.lede { font-size: 17px; line-height: 1.5; color: #333333; max-width: 1040px; margin-bottom: 18px; }\n.mono, code { font-family: 'JetBrains Mono', monospace; }\ncode { font-size: 0.9em; background: #F4F4F4; padding: 1px 5px; color: #1A1A1A; }\nb { color: #1A1A1A; }\n\n/* bordered box with a black label bar */\n.box { border: 2px solid #1A1A1A; display: flex; flex-direction: column; }\n.box > .label {\n  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em;\n  text-transform: uppercase; background: #1A1A1A; color: #FFFFFF; padding: 8px 14px;\n  display: flex; justify-content: space-between; align-items: center;\n}\n.box > .label.red { background: #D9381E; }\n.box > .label.light { background: #FFFFFF; color: #1A1A1A; border-bottom: 2px solid #1A1A1A; }\n.box > .body { padding: 14px 18px 16px 18px; font-size: 14.5px; line-height: 1.55; color: #333333; flex: 1; }\n.box > .body p + p { margin-top: 8px; }\n\n/* strip: red tag + text */\n.strip { border: 2px solid #1A1A1A; display: flex; align-items: stretch; }\n.strip .tag {\n  background: #D9381E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 12px;\n  font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 12px 16px;\n  display: flex; align-items: center; flex-shrink: 0;\n}\n.strip .tag.ink { background: #1A1A1A; }\n.strip .text { padding: 12px 20px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; color: #333333; }\n.strip .text b { color: #1A1A1A; }\n\n.eyebrow {\n  font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em;\n  text-transform: uppercase; color: #D9381E; margin-bottom: 6px;\n}\n.cols { display: grid; gap: 18px; }\n.c2 { grid-template-columns: 1fr 1fr; }\n.c3 { grid-template-columns: 1fr 1fr 1fr; }\n.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }\n\n/* log / code block */\n.term {\n  background: #1A1A1A; color: #E8E8E8; font-family: 'JetBrains Mono', monospace; font-size: 12px;\n  line-height: 1.6; padding: 12px 16px; white-space: pre; overflow: hidden;\n}\n.term .d { color: #F28B7A; font-weight: 700; }\n.term .g { color: #9fd3a8; font-weight: 700; }\n.term .m { color: #8a8a8a; }\n.term .k { color: #f2c46d; }\n\n/* small pills */\n.pill {\n  display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;\n  letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border: 1.5px solid #1A1A1A;\n}\n.pill.red { border-color: #D9381E; color: #D9381E; }\n.pill.fill { background: #1A1A1A; color: #FFFFFF; }\n.pill.ok { border-color: #4d7a5b; color: #4d7a5b; }\n\n.footer {\n  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;\n  padding: 10px 72px 14px 72px; border-top: 1px solid #E0E0E0; margin-top: auto;\n}\n.footer span { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #999999; letter-spacing: 0.06em; }\n.footer .poc { color: #D9381E; font-weight: 700; }\n<\/style>\n<style>\n  h1 { margin-bottom: 10px; }\n  .src { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #555; margin-bottom: 14px; }\n  table { width: 100%; border-collapse: collapse; border: 2px solid #1A1A1A; }\n  th { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; text-align: left; padding: 8px 12px; background: #1A1A1A; color: #fff; }\n  td { padding: 9px 12px; border-bottom: 1px solid #E6E6E6; font-size: 13px; line-height: 1.4; color: #333; vertical-align: top; }\n  td:first-child { font-weight: 800; color: #1A1A1A; white-space: nowrap; }\n  td.no { color: #8a8a8a; }\n  td code { font-size: 11.3px; }\n  .trifecta { margin-top: 14px; display: grid; grid-template-columns: 210px 1fr 1fr 1fr; border: 2px solid #1A1A1A; }\n  .trifecta div { padding: 9px 12px; font-size: 12.8px; line-height: 1.45; color: #333; border-right: 1px solid #E0E0E0; }\n  .trifecta div:last-child { border-right: 0; }\n  .trifecta .t { background: #D9381E; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; }\n  .trifecta b { display: block; font-size: 13.5px; }\n  .reads { display: grid; grid-template-columns: 150px 1fr 1fr 1fr; border: 2px solid #1A1A1A; margin: 4px 0 12px 0; }\n  .reads > div { padding: 8px 12px; font-size: 12.2px; line-height: 1.4; color: #333; border-right: 1px solid #E0E0E0; }\n  .reads > div:last-child { border-right: 0; }\n  .reads .rl { background: #1A1A1A; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; }\n  .reads b { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10.8px; color: #1A1A1A; margin-bottom: 2px; }\n  .reads span { display: block; color: #3f7a52; font-weight: 700; margin-top: 3px; }\n  /* sizing pass */\n  td { padding: 8px 14px; font-size: 13.4px; }\n  th { padding: 7px 14px; }\n  .src { font-size: 13px; margin-bottom: 18px; }\n  .trifecta { margin-top: 12px; }\n  .trifecta div { font-size: 12.8px; padding: 8px 12px; }\n  .trifecta b { font-size: 13.4px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">18 — Against current research<\/div>\n    <h1>What I read, and where this sits against it<\/h1>\n    <div class=\"reads\">\n      <div class=\"rl\">Read before building<\/div>\n      <div><b>NSA AISC · CSI, May 2026<\/b>MCP: Security Design Considerations for AI-Driven Automation<span>→ secure defaults, fail closed<\/span><\/div>\n      <div><b>Errico, Ngiam, Sojan · arXiv:2511.20920<\/b>Securing the MCP: Risks, Controls, and Governance<span>→ the five categories below<\/span><\/div>\n      <div><b>Acharya, Gupta · arXiv:2604.05969<\/b>MCPShield: a formal security framework for MCP agents<span>→ formal proof + defense in depth<\/span><\/div>\n    <\/div>\n    <table>\n      <tr><th>Category<\/th><th>Enforced and graded here<\/th><th>Not here, stated in the README<\/th><\/tr>\n      <tr><td>AuthN / AuthZ<\/td><td>Credential bound to host, port and path; the agent holds a placeholder. Per-tool allowlist on MCP calls.<\/td><td class=\"no\">Per-user OAuth 2.1, per-user RBAC<\/td><\/tr>\n      <tr><td>Provenance<\/td><td>OpenShell's OCSF log; evidence bundle with the exact line per control, hash-chained and signed.<\/td><td class=\"no\">SIEM shipping, retention tiers, redaction<\/td><\/tr>\n      <tr><td>Sandboxing<\/td><td>Landlock (hard requirement), non-root, default-deny egress, binary identity, no host credentials inside.<\/td><td class=\"no\">Resource quotas<\/td><\/tr>\n      <tr><td>Inline policy<\/td><td>Kyverno CEL per tool and argument, before credentials, <b>fail-closed<\/b>; OpenShell L7 method and path rules.<\/td><td class=\"no\">DLP on payloads, response inspection, rate limits<\/td><\/tr>\n      <tr><td>Governance<\/td><td>Signed operator boundary with a containment proof; reviewer signatures; agent proposals rejected by proof; a tool advertised later is still not callable.<\/td><td class=\"no\">Private registry, SBOMs, signed server builds<\/td><\/tr>\n    <\/table>\n    <div class=\"trifecta\">\n      <div class=\"t\">The \"lethal trifecta\"<\/div>\n      <div><b>Private data<\/b>Landlock hides the secret file, and the credential is only a placeholder.<\/div>\n      <div><b>Untrusted content<\/b>Assume the agent is already steered; nothing here depends on it behaving.<\/div>\n      <div><b>External communication<\/b>Default-deny egress, credential binding and the MCP allowlist close the way out.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>OPENSHELL AGENT GUARDRAILS · AMARTYA PANDEY<\/span>\n    <span>PAGE 18 / 20<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Shared slide styles. build.py inlines this file into every slide. */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { background: #FFFFFF; }\n.slide-container {\n  width: 1280px; height: 720px; background: #FFFFFF; overflow: hidden;\n  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #1A1A1A;\n  display: flex; flex-direction: column; position: relative;\n}\n.accent-rule { width: 1280px; height: 3px; background: #D9381E; flex-shrink: 0; }\n.inner { padding: 36px 72px 0 72px; flex: 1; display: flex; flex-direction: column; min-height: 0; }\n.kicker {\n  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.12em;\n  color: #1A1A1A; text-transform: uppercase; margin-bottom: 10px;\n}\n.kicker::before {\n  content: \"\"; display: inline-block; width: 7px; height: 7px; background: #D9381E;\n  margin-right: 10px; vertical-align: middle; margin-bottom: 2px;\n}\n.kicker span { color: #8a8a8a; }\nh1 { font-weight: 900; font-size: 42px; line-height: 1.04; letter-spacing: -0.015em; margin-bottom: 20px; }\nh1 .hl, .hl { color: #D9381E; }\n.lede { font-size: 17px; line-height: 1.5; color: #333333; max-width: 1040px; margin-bottom: 18px; }\n.mono, code { font-family: 'JetBrains Mono', monospace; }\ncode { font-size: 0.9em; background: #F4F4F4; padding: 1px 5px; color: #1A1A1A; }\nb { color: #1A1A1A; }\n\n/* bordered box with a black label bar */\n.box { border: 2px solid #1A1A1A; display: flex; flex-direction: column; }\n.box > .label {\n  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em;\n  text-transform: uppercase; background: #1A1A1A; color: #FFFFFF; padding: 8px 14px;\n  display: flex; justify-content: space-between; align-items: center;\n}\n.box > .label.red { background: #D9381E; }\n.box > .label.light { background: #FFFFFF; color: #1A1A1A; border-bottom: 2px solid #1A1A1A; }\n.box > .body { padding: 14px 18px 16px 18px; font-size: 14.5px; line-height: 1.55; color: #333333; flex: 1; }\n.box > .body p + p { margin-top: 8px; }\n\n/* strip: red tag + text */\n.strip { border: 2px solid #1A1A1A; display: flex; align-items: stretch; }\n.strip .tag {\n  background: #D9381E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 12px;\n  font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 12px 16px;\n  display: flex; align-items: center; flex-shrink: 0;\n}\n.strip .tag.ink { background: #1A1A1A; }\n.strip .text { padding: 12px 20px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; color: #333333; }\n.strip .text b { color: #1A1A1A; }\n\n.eyebrow {\n  font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em;\n  text-transform: uppercase; color: #D9381E; margin-bottom: 6px;\n}\n.cols { display: grid; gap: 18px; }\n.c2 { grid-template-columns: 1fr 1fr; }\n.c3 { grid-template-columns: 1fr 1fr 1fr; }\n.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }\n\n/* log / code block */\n.term {\n  background: #1A1A1A; color: #E8E8E8; font-family: 'JetBrains Mono', monospace; font-size: 12px;\n  line-height: 1.6; padding: 12px 16px; white-space: pre; overflow: hidden;\n}\n.term .d { color: #F28B7A; font-weight: 700; }\n.term .g { color: #9fd3a8; font-weight: 700; }\n.term .m { color: #8a8a8a; }\n.term .k { color: #f2c46d; }\n\n/* small pills */\n.pill {\n  display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;\n  letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border: 1.5px solid #1A1A1A;\n}\n.pill.red { border-color: #D9381E; color: #D9381E; }\n.pill.fill { background: #1A1A1A; color: #FFFFFF; }\n.pill.ok { border-color: #4d7a5b; color: #4d7a5b; }\n\n.footer {\n  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;\n  padding: 10px 72px 14px 72px; border-top: 1px solid #E0E0E0; margin-top: auto;\n}\n.footer span { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #999999; letter-spacing: 0.06em; }\n.footer .poc { color: #D9381E; font-weight: 700; }\n<\/style>\n<style>\n  h1 { margin-bottom: 14px; }\n  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }\n  .card { border: 2px solid #1A1A1A; padding: 10px 14px 12px 14px; display: flex; flex-direction: column; }\n  .card .n { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #D9381E; letter-spacing: 0.1em; margin-bottom: 4px; }\n  .card h3 { font-size: 15px; font-weight: 800; line-height: 1.25; margin-bottom: 6px; }\n  .card .r { display: grid; grid-template-columns: 50px 1fr; gap: 6px; font-size: 12.3px; line-height: 1.4; color: #333; margin-bottom: 4px; }\n  .card .r .k { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8a8a; padding-top: 2px; }\n  .card .r.fix .k { color: #4d7a5b; }\n  .card code { font-size: 11px; }\n  .strip { margin-top: 14px; }\n  /* sizing pass: fill the 720px frame */\n  .card { padding: 14px 16px 16px 16px; }\n  .card h3 { font-size: 16.5px; margin-bottom: 8px; }\n  .card .r { font-size: 13.3px; margin-bottom: 6px; }\n  .grid { gap: 16px; }\n  .strip { margin-top: 18px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">19 — Honesty <span>· what the docs didn't tell me<\/span><\/div>\n    <h1>What I got wrong, and how I found out<\/h1>\n    <div class=\"grid\">\n      <div class=\"card\"><div class=\"n\">01 · OPENSHELL ON MACOS<\/div><h3>Sandbox creation just failed<\/h3>\n        <div class=\"r\"><span class=\"k\">Saw<\/span><span><code>Startup configuration fetch failed<\/code>, with no doc explaining it.<\/span><\/div>\n        <div class=\"r\"><span class=\"k\">Cause<\/span><span>Docker Desktop host networking was off, so the supervisor couldn't reach the gateway.<\/span><\/div>\n        <div class=\"r fix\"><span class=\"k\">Fix<\/span><span>Preflight reads <code>HostNetworkingEnabled<\/code> and says how to fix it.<\/span><\/div><\/div>\n      <div class=\"card\"><div class=\"n\">02 · MY OWN PREFLIGHT<\/div><h3>It rejected a correct install<\/h3>\n        <div class=\"r\"><span class=\"k\">Saw<\/span><span>A fresh clone failed on the version check.<\/span><\/div>\n        <div class=\"r\"><span class=\"k\">Cause<\/span><span>The CLI prints <code>0.1.3<\/code>. I matched <code>v0.1.3<\/code>.<\/span><\/div>\n        <div class=\"r fix\"><span class=\"k\">Fix<\/span><span>Fixed the match. Now I always test the handover, not just the build.<\/span><\/div><\/div>\n      <div class=\"card\"><div class=\"n\">03 · A LOG LINE I DIDN'T TRUST<\/div><h3>A draft invented a reason string<\/h3>\n        <div class=\"r\"><span class=\"k\">Saw<\/span><span>A draft doc said metadata denials read \"always-blocked address\".<\/span><\/div>\n        <div class=\"r\"><span class=\"k\">Cause<\/span><span>Written from assumption. The real line says <code>transparent_tcp_policy_denied<\/code>.<\/span><\/div>\n        <div class=\"r fix\"><span class=\"k\">Fix<\/span><span>Every pattern is checked against captured output, and the fixtures are real.<\/span><\/div><\/div>\n      <div class=\"card\"><div class=\"n\">04 · KYVERNO AUTHZ<\/div><h3>It loaded zero policies, silently<\/h3>\n        <div class=\"r\"><span class=\"k\">Saw<\/span><span>No policy decisions were being made, and there was no error.<\/span><\/div>\n        <div class=\"r\"><span class=\"k\">Cause<\/span><span>v0.4.0 wants <code>policies.kyverno.io/v1alpha1<\/code>. The current docs show <code>v1<\/code>.<\/span><\/div>\n        <div class=\"r fix\"><span class=\"k\">Fix<\/span><span>Pinned the apiVersion and confirmed the DENY in OpenShell's log.<\/span><\/div><\/div>\n      <div class=\"card\"><div class=\"n\">05 · KYVERNO AUTHZ<\/div><h3>An allow overrode a deny<\/h3>\n        <div class=\"r\"><span class=\"k\">Saw<\/span><span>With two policies loaded, every MCP call passed, but each policy alone was correct.<\/span><\/div>\n        <div class=\"r\"><span class=\"k\">Cause<\/span><span>The GitHub rule's explicit <code>Allowed()<\/code> decided requests it was never meant for.<\/span><\/div>\n        <div class=\"r fix\"><span class=\"k\">Fix<\/span><span><code>matchConditions<\/code> per policy, then re-proved every case live.<\/span><\/div><\/div>\n      <div class=\"card\"><div class=\"n\">06 · LIFECYCLE<\/div><h3>The guard died while registered<\/h3>\n        <div class=\"r\"><span class=\"k\">Saw<\/span><span>The process exited with the shell that started it.<\/span><\/div>\n        <div class=\"r\"><span class=\"k\">Cause<\/span><span>The gateway refuses to start if a registered middleware is down.<\/span><\/div>\n        <div class=\"r fix\"><span class=\"k\">Fix<\/span><span>Built binary + nohup. Stop unregisters and restores the config exactly.<\/span><\/div><\/div>\n    <\/div>\n    <div class=\"strip\">\n      <div class=\"tag ink\">Pattern<\/div>\n      <div class=\"text\">When the docs ran out, <b>I went to the source and to real output<\/b>, and fixed the tooling so the next person doesn't hit the same wall.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>OPENSHELL AGENT GUARDRAILS · AMARTYA PANDEY<\/span>\n    <span>PAGE 19 / 20<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Shared slide styles. build.py inlines this file into every slide. */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { background: #FFFFFF; }\n.slide-container {\n  width: 1280px; height: 720px; background: #FFFFFF; overflow: hidden;\n  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #1A1A1A;\n  display: flex; flex-direction: column; position: relative;\n}\n.accent-rule { width: 1280px; height: 3px; background: #D9381E; flex-shrink: 0; }\n.inner { padding: 36px 72px 0 72px; flex: 1; display: flex; flex-direction: column; min-height: 0; }\n.kicker {\n  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.12em;\n  color: #1A1A1A; text-transform: uppercase; margin-bottom: 10px;\n}\n.kicker::before {\n  content: \"\"; display: inline-block; width: 7px; height: 7px; background: #D9381E;\n  margin-right: 10px; vertical-align: middle; margin-bottom: 2px;\n}\n.kicker span { color: #8a8a8a; }\nh1 { font-weight: 900; font-size: 42px; line-height: 1.04; letter-spacing: -0.015em; margin-bottom: 20px; }\nh1 .hl, .hl { color: #D9381E; }\n.lede { font-size: 17px; line-height: 1.5; color: #333333; max-width: 1040px; margin-bottom: 18px; }\n.mono, code { font-family: 'JetBrains Mono', monospace; }\ncode { font-size: 0.9em; background: #F4F4F4; padding: 1px 5px; color: #1A1A1A; }\nb { color: #1A1A1A; }\n\n/* bordered box with a black label bar */\n.box { border: 2px solid #1A1A1A; display: flex; flex-direction: column; }\n.box > .label {\n  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em;\n  text-transform: uppercase; background: #1A1A1A; color: #FFFFFF; padding: 8px 14px;\n  display: flex; justify-content: space-between; align-items: center;\n}\n.box > .label.red { background: #D9381E; }\n.box > .label.light { background: #FFFFFF; color: #1A1A1A; border-bottom: 2px solid #1A1A1A; }\n.box > .body { padding: 14px 18px 16px 18px; font-size: 14.5px; line-height: 1.55; color: #333333; flex: 1; }\n.box > .body p + p { margin-top: 8px; }\n\n/* strip: red tag + text */\n.strip { border: 2px solid #1A1A1A; display: flex; align-items: stretch; }\n.strip .tag {\n  background: #D9381E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 12px;\n  font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 12px 16px;\n  display: flex; align-items: center; flex-shrink: 0;\n}\n.strip .tag.ink { background: #1A1A1A; }\n.strip .text { padding: 12px 20px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; color: #333333; }\n.strip .text b { color: #1A1A1A; }\n\n.eyebrow {\n  font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em;\n  text-transform: uppercase; color: #D9381E; margin-bottom: 6px;\n}\n.cols { display: grid; gap: 18px; }\n.c2 { grid-template-columns: 1fr 1fr; }\n.c3 { grid-template-columns: 1fr 1fr 1fr; }\n.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }\n\n/* log / code block */\n.term {\n  background: #1A1A1A; color: #E8E8E8; font-family: 'JetBrains Mono', monospace; font-size: 12px;\n  line-height: 1.6; padding: 12px 16px; white-space: pre; overflow: hidden;\n}\n.term .d { color: #F28B7A; font-weight: 700; }\n.term .g { color: #9fd3a8; font-weight: 700; }\n.term .m { color: #8a8a8a; }\n.term .k { color: #f2c46d; }\n\n/* small pills */\n.pill {\n  display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;\n  letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border: 1.5px solid #1A1A1A;\n}\n.pill.red { border-color: #D9381E; color: #D9381E; }\n.pill.fill { background: #1A1A1A; color: #FFFFFF; }\n.pill.ok { border-color: #4d7a5b; color: #4d7a5b; }\n\n.footer {\n  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;\n  padding: 10px 72px 14px 72px; border-top: 1px solid #E0E0E0; margin-top: auto;\n}\n.footer span { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #999999; letter-spacing: 0.06em; }\n.footer .poc { color: #D9381E; font-weight: 700; }\n<\/style>\n<style>\n  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }\n  .not li { list-style: none; font-size: 14px; line-height: 1.5; color: #333; padding: 7px 0 7px 22px; border-bottom: 1px solid #EEE; position: relative; }\n  .not li:last-child { border-bottom: 0; }\n  .not li::before { content: \"✕\"; position: absolute; left: 0; top: 7px; color: #D9381E; font-weight: 900; font-size: 13px; }\n  .not li b { color: #1A1A1A; }\n  .term { font-size: 13.5px; line-height: 1.75; padding: 14px 18px; }\n  .ask { margin-top: 12px; font-size: 14px; line-height: 1.5; color: #333; }\n  .closing { margin-top: 20px; border: 3px solid #1A1A1A; padding: 16px 22px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }\n  .closing .big { font-size: 22px; font-weight: 800; line-height: 1.35; }\n  .closing .big span { color: #D9381E; }\n  .closing .who { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #555; text-align: right; line-height: 1.6; }\n  /* sizing pass: fill the 720px frame */\n  .not li { font-size: 14.5px; padding: 8px 0 8px 24px; }\n  .not li::before { top: 8px; }\n  .term { font-size: 13.4px; line-height: 1.7; padding: 14px 18px; }\n  .ask { font-size: 15px; margin-top: 16px; }\n  .closing { margin-top: 30px; padding: 22px 26px; }\n  .closing .big { font-size: 24px; }\n  .closing .who { font-size: 13.5px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"slide-container\">\n  <div class=\"accent-rule\"><\/div>\n  <div class=\"inner\">\n    <div class=\"kicker\">20 — Scope, and how to run it<\/div>\n    <h1>Precise about what it is, and what it isn't<\/h1>\n    <div class=\"grid\">\n      <div class=\"box\">\n        <div class=\"label red\">What this is not<\/div>\n        <div class=\"body\"><ul class=\"not\">\n          <li><b>Not a fleet.<\/b> One gateway, one Docker host, one sandbox.<\/li>\n          <li><b>Not AIControls.<\/b> It's the runtime evidence a fleet product would want to collect.<\/li>\n          <li><b>Not production-grade OpenShell.<\/b> v0.1.3 is alpha, so it's pinned.<\/li>\n          <li><b>Not the cost domain.<\/b> Spend and quotas aren't measured here.<\/li>\n          <li><b>Not response-side.<\/b> Injection carried in a tool's response isn't inspected.<\/li>\n          <li><b>Not a retention system.<\/b> The signed evidence stays on this machine.<\/li>\n        <\/ul><\/div>\n      <\/div>\n      <div>\n<div class=\"term\"><span class=\"m\"># on your machine (Docker Desktop, host networking on)<\/span>\nmake setup        <span class=\"m\"># image, profile, fake provider<\/span>\nmake verify       <span class=\"m\"># gate → sandbox → <span class=\"g\">12 PASS / 0 FAIL<\/span><\/span>\nmake policy-tamper <span class=\"m\"># 8 edits, 8 refusals<\/span>\nmake approval-demo <span class=\"m\"># proposals rejected by proof<\/span>\nmake evidence     <span class=\"m\"># signed, hash-chained<\/span>\nmake kyverno      <span class=\"m\"># bonus: paths + MCP, 10 rows<\/span>\nmake kyverno-stop <span class=\"m\"># restore gateway.toml exactly<\/span>\nmake clean<\/div>\n        <div class=\"ask\">Prerequisites, checks and the full control table are in <code>README.md<\/code>. <code>docs/ARCHITECTURE.md<\/code> says what is enforced where.<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"closing\">\n      <div class=\"big\">I can pick up a brand-new runtime, go to its source when the docs stop, and come back with something that <span>actually runs<\/span> and ties to what Nirmata is building.<\/div>\n      <div class=\"who\">Amartya Pandey<br>github.com/amartyatatspandey<br>Thank you, Ritesh.<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"footer\">\n    <span>OPENSHELL AGENT GUARDRAILS · AMARTYA PANDEY<\/span>\n    <span>PAGE 20 / 20<\/span>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n"];
const INTERACTIVE = new Set([6]);
const TOTAL = SLIDES.length;
const frame = document.getElementById("frame");
const wrap = document.getElementById("wrap");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const hint = document.getElementById("hint");
const hitPrev = document.getElementById("hitPrev");
const hitNext = document.getElementById("hitNext");
const HINT_DEFAULT = "← → &nbsp; SPACE &nbsp; F FULLSCREEN";
const HINT_LIVE = "CLICK BOXES · 1–0 PICK A CONTROL · ← → TO CONTINUE · ESC CLOSES";
let index = 0;

function pad(n) {
  return String(n).padStart(2, "0");
}

function parseHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  const n = parseInt(raw, 10);
  if (Number.isFinite(n) && n >= 1 && n <= TOTAL) return n - 1;
  return 0;
}

function isLive(i) {
  return INTERACTIVE.has(i);
}

function fit() {
  if (isLive(index)) {
    wrap.style.width = window.innerWidth + "px";
    wrap.style.height = (window.innerHeight - 36) + "px";
    wrap.style.transform = "none";
    return;
  }
  wrap.style.width = "1280px";
  wrap.style.height = "720px";
  const s = Math.min(window.innerWidth / 1280, (window.innerHeight - 8) / 720);
  wrap.style.transform = "scale(" + s + ")";
}

function bindFrameKeys() {
  try {
    const doc = frame.contentDocument;
    if (!doc) return;
    doc.addEventListener("keydown", function (e) {
      if (e.key === "Escape") return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const nav = ["ArrowRight","ArrowLeft","ArrowDown","ArrowUp","PageDown","PageUp"," ","Home","End","f","F","Backspace"];
      if (nav.indexOf(e.key) === -1) return;
      e.preventDefault();
      handleKey(e.key);
    });
  } catch (err) {}
}

function show(i, pushHash) {
  index = Math.max(0, Math.min(TOTAL - 1, i));
  const live = isLive(index);
  wrap.classList.toggle("live", live);
  hint.innerHTML = live ? HINT_LIVE : HINT_DEFAULT;
  frame.srcdoc = SLIDES[index];
  counter.textContent = "PAGE " + pad(index + 1) + " / " + pad(TOTAL);
  progress.style.width = ((index + 1) / TOTAL * 100) + "%";
  hitPrev.disabled = index === 0;
  hitNext.disabled = index === TOTAL - 1;
  if (pushHash) history.replaceState(null, "", "#" + (index + 1));
  fit();
  if (live) {
    frame.addEventListener("load", bindFrameKeys, { once: true });
  } else {
    window.focus();
  }
}

function next() { show(index + 1, true); }
function prev() { show(index - 1, true); }

function handleKey(key) {
  switch (key) {
    case "ArrowRight":
    case "ArrowDown":
    case "PageDown":
    case " ":
      next();
      break;
    case "ArrowLeft":
    case "ArrowUp":
    case "PageUp":
    case "Backspace":
      prev();
      break;
    case "Home":
      show(0, true);
      break;
    case "End":
      show(TOTAL - 1, true);
      break;
    case "f":
    case "F":
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
  }
}

document.addEventListener("keydown", function (e) {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const nav = ["ArrowRight","ArrowLeft","ArrowDown","ArrowUp","PageDown","PageUp"," ","Home","End","f","F","Backspace"];
  if (nav.indexOf(e.key) === -1) return;
  e.preventDefault();
  handleKey(e.key);
});

hitPrev.addEventListener("click", function () { prev(); this.blur(); });
hitNext.addEventListener("click", function () { next(); this.blur(); });
window.addEventListener("hashchange", function () { show(parseHash(), false); });
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);

fit();
show(parseHash(), true);
</script>
