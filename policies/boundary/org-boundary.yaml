# Operator-owned ceiling for every agent policy in this repo.
#
# A candidate policy is accepted only if openshell-prover proves it is
# contained in this file (`within_boundary`). The ceiling is wider than
# agent-policy.yaml, so an agent policy can grow, but never past these
# invariants: Landlock as a hard requirement, uid/gid 1000, read-only REST,
# curl as the only network binary, and a short host list with no
# link-local or metadata address.
version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1000"
  run_as_group: "1000"

network_policies:
  github_api_readonly:
    name: github-api-read-only
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
  github_raw_readonly:
    name: github-raw-read-only
    endpoints:
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
  public_echo_readonly:
    name: public-echo-read-only
    endpoints:
      - host: httpbin.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
