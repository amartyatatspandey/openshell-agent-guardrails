version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1000"
  run_as_group: "1000"

network_policies:
  github_readonly:
    name: github-read-only
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
  public_echo:
    name: public-echo-read-only
    endpoints:
      - host: httpbin.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl

# Runs only after OpenShell has already admitted the request. DELETE and POST
# never reach this stage. The CEL rule then allows one fictional read path.
network_middlewares:
  kyverno_guard:
    name: kyverno-path-guard
    middleware: kyverno-guard
    order: 10
    on_error: fail_closed
    endpoints:
      include:
        - api.github.com
