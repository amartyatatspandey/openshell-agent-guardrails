version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1000"
  run_as_group: "1000"

network_policies:
  github_readonly:
    name: github-read-only
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
  public_echo:
    name: public-echo-read-only
    endpoints:
      - host: httpbin.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
  mcp_demo:
    name: fake-mcp-server
    endpoints:
      - host: host.openshell.internal
        port: 8766
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /mcp
    binaries:
      - path: /usr/bin/curl

# Runs only after OpenShell has already admitted the request, before provider
# credentials. On api.github.com, DELETE and POST never reach this stage and
# the CEL rule allows one fictional read path. On the fake MCP server, OpenShell
# admits only POST /mcp and Kyverno decides which tool and which arguments.
network_middlewares:
  kyverno_guard:
    name: kyverno-guard-policies
    middleware: kyverno-guard
    order: 10
    on_error: fail_closed
    endpoints:
      include:
        - api.github.com
        - host.openshell.internal
